<div class="content-container">
    <form>
        <label for="email">Login</label><br>
        <input class="input-simples" id="email" name="email" type="email" placeholder="Digite seu email" 
            [(ngModel)="login"]
            (keyup)="teclaDigitada($event)"
        />
        <label for="input-senha">Senha</label><br>
        <input class="input-simples" id="input-senha" name="input-senha" type="password" placeholder="Digite sua senha" 
            [(ngModel)]="senha"
            (keyup)="validarFormulario()"
        />
        <button class="input-submeter" (click)="onBotaoClicado()">
            Confirmar
        </button>
    </form>
</div>
